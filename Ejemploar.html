<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MTC - Ejemplo de Realidad Aumentada</title>

    <link rel="stylesheet" href="css/Ejemploar.css">

    <!-- Realidad Aumentada con marcador: A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>


<body>

    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <div class="barra-ar">

        <div>
            <h1>MTC - Realidad Aumentada</h1>
            <p>Apunta la cámara al marcador Hiro</p>
        </div>

        <a href="realidadVirtualAumentada.html">Volver</a>

    </div>


    <!-- =========================
         MENSAJE INFERIOR
    ========================== -->

    <div id="mensaje-marcador" class="mensaje-marcador">
        Acepta el permiso de la cámara y enfoca el marcador completo,
        con buena luz y sin reflejos.
    </div>


    <!-- =========================
         ESCENA DE REALIDAD AUMENTADA
    ========================== -->

    <a-scene embedded
             vr-mode-ui="enabled: false"
             renderer="logarithmicDepthBuffer: true; precision: medium;"
             arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-marker id="marcador-hiro" preset="hiro">

            <!-- Cubo azul que gira -->
            <a-box position="0 0.5 0"
                   width="0.8" height="0.8" depth="0.8"
                   color="#087ec1"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            </a-box>

            <!-- Esfera amarilla encima del cubo -->
            <a-sphere position="0 1.3 0"
                      radius="0.3"
                      color="#ffcc00"
                      animation="property: position; to: 0 1.5 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
            </a-sphere>

            <!-- Cilindro a un lado -->
            <a-cylinder position="1.1 0.4 0"
                        radius="0.25" height="0.8"
                        color="#063b70">
            </a-cylinder>

            <!-- Anillo al otro lado -->
            <a-torus position="-1.1 0.5 0"
                     radius="0.3" radius-tubular="0.08"
                     color="#e53935"
                     animation="property: rotation; to: 360 0 0; loop: true; dur: 4000; easing: linear">
            </a-torus>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <!-- JavaScript del ejemplo de realidad aumentada -->
    <script src="js/ejemploAR.js"></script>

</body>

</html>
